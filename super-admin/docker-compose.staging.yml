services:
  admin:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api-staging.pesaa.io/api/v1}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://staging-app.pesaa.io}
    restart: unless-stopped
    # Only the host's Nginx talks to it: bound to localhost, never exposed publicly.
    ports:
      - "127.0.0.1:3015:3000"
