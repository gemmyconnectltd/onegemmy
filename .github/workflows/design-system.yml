name: Pesaa UI quality
on:
  pull_request:
    paths: ['frontend/**', 'website/**', 'super-admin/**', 'design-system/**', 'scripts/*design*', '.github/workflows/design-system.yml']
  push:
    branches: [main]
    paths: ['frontend/**', 'website/**', 'super-admin/**', 'design-system/**', 'scripts/*design*', '.github/workflows/design-system.yml']
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [frontend, website, super-admin]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run design:check
      - run: npm run design:test
      - run: npm run lint
      - run: npm run typecheck
      - if: matrix.app == 'frontend'
        run: node --test tests/*.test.cjs
      - run: npm run build
